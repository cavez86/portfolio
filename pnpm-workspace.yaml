saveExact: true

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  core-js: false
  esbuild: false
  msw: false
  sharp: true
  unrs-resolver: false

supportedArchitectures:
  os:
    - current
    - linux
    - win32
  cpu:
    - current
    - x64
  libc:
    - current
    - glibc

# plugin-mcp transpiles its generated zod schema with ts.transpileModule, which
# TypeScript 7 (native port) does not export; without it every MCP tool falls
# back to an empty input schema and silently drops all content fields.
packageExtensions:
  '@payloadcms/plugin-mcp':
    dependencies:
      typescript: 6.0.3

overrides:
  '@hono/node-server': ^1.19.15
  '@modelcontextprotocol/sdk': ^1.31.0
  brace-expansion: ^5.0.12
  dompurify: ^3.4.12
  esbuild: ^0.25.12
  hono: ^4.13.7
  ip-address: ^10.7.1
  js-yaml: ^4.3.1
  proxy-addr: ^2.0.8
  sharp: ^0.35.5
  source-map-js: ^1.2.2
  undici: ^7.29.0

patchedDependencies:
  '@payloadcms/plugin-mcp@3.92.1': patches/@payloadcms__plugin-mcp@3.92.1.patch
  braces@3.0.3: patches/braces@3.0.3.patch
