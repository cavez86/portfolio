version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: sharp
    groups:
      next:
        patterns:
          - "next"
          - "@next/*"
      payload:
        patterns:
          - "payload"
          - "@payloadcms/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      trpc:
        patterns:
          - "@trpc/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "tw-animate-css"
      posthog:
        patterns:
          - "posthog-*"
      vercel:
        patterns:
          - "@vercel/*"
